name: Deploy MyST Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pruebas de los datos
        run: |
          pip install --quiet numpy==2.4.6 pandas==3.1.1 xarray==2026.9.0 netcdf4==1.7.5.1.post1
          python scripts/probar_datos.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Install MyST
        run: npm install -g mystmd@1.13.0
      - name: Install fonts (Liberation)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation

      - name: Install Typst
        env:
          TYPST_VERSION: v0.15.0
          TYPST_SHA256: 59b207df01be2dab9f13e80f73d04d7ff8273ffd46b3dd1b9eef5c60f3eeabea
        run: |
          curl -fsSL -o typst.tar.xz "https://github.com/typst/typst/releases/download/${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "${TYPST_SHA256}  typst.tar.xz" | sha256sum -c -
          tar -xJf typst.tar.xz
          sudo mv typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
      - name: Build PDF (Typst)
        run: myst build --typst
        continue-on-error: true
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
      - name: Build MyST site
        run: myst build --html
        env:
          BASE_URL: /cuadernos-reproducibles-crc001
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_build/html"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
